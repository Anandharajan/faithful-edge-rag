[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faithful-edge-rag"
version = "0.1.0"
description = "Open-source edge-cloud RAG research prototype for distributed, private, and conflicting knowledge."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Research Contributors" }
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "structlog>=24.0.0",
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0"
]
rag = [
  "qdrant-client>=1.10.0",
  "sentence-transformers>=3.0.0",
  "langgraph>=0.2.0",
  "llama-index>=0.11.0"
]

[project.scripts]
faithful-edge-rag-experiments = "faithful_edge_rag.experiments.run:main"
faithful-edge-rag-publication = "faithful_edge_rag.experiments.run_publication:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
